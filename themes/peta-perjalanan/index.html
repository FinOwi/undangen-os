*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 48px)}
body{margin:0;position:relative;background:var(--bg);color:var(--ink);font:400 16px/1.6 Fraunces,Georgia,serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.map{position:absolute;inset:0;z-index:-1;background-color:var(--block);background-image:repeating-linear-gradient(90deg,var(--street) 0 7px,transparent 7px 180px),repeating-linear-gradient(0deg,var(--street) 0 7px,transparent 7px 150px),repeating-linear-gradient(90deg,var(--street2) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,var(--street2) 0 2px,transparent 2px 50px)}

main{position:relative;max-width:560px;margin:0 auto}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}

section{position:relative;scroll-snap-align:start;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:72px 16px}
.lab{font:700 11px/1 'Chakra Petch',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h1,h2{font-weight:500;line-height:1.1;margin:.3em 0}
h1{font-size:clamp(40px,12vw,64px)}
.cover{align-items:center;text-align:center}
.cover p{margin:.4em 0;color:var(--muted)}
.btn{background:var(--route);color:#111;border:0;border-radius:10px;padding:14px 26px;font:700 14px 'Chakra Petch',sans-serif;letter-spacing:.06em;cursor:pointer;margin-top:18px}
.pin{position:absolute;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:var(--card);border:3px solid var(--route);display:grid;place-items:center;font:700 14px 'Chakra Petch',sans-serif;z-index:2}
.l .pin{left:10%}.r .pin{right:10%}
.pin.sf{left:50%;margin-left:-19px;right:auto}
#startpin{top:auto;bottom:36px;margin-top:0}#endpin{top:36px;margin-top:0}
.card{position:relative;z-index:1;width:min(70%,380px);background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--cb);border-radius:16px;overflow:hidden;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.in .card{opacity:1;transform:none}
.l .card{margin-left:auto}.r .card{margin-right:auto}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.cap{padding:12px 14px 16px}.cap h2{font-size:22px}.cap p{margin:0;color:var(--muted);font-size:15px}
.fin{text-align:center}
.cd{display:flex;gap:12px;justify-content:center;margin:12px 0}
.cd div{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:8px 12px;min-width:64px;font:700 22px 'Chakra Petch',sans-serif}
.cd small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.ev{position:relative;z-index:1;background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:14px;margin:10px 0;text-align:left}
.ev h3{margin:0 0 4px;font-weight:500}.ev a{color:var(--accent);font-weight:500}
.f{width:100%;padding:10px;margin:0 0 10px;border:1px solid var(--cb);border-radius:8px;background:var(--bg)}
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--cb);font:700 12px 'Chakra Petch',sans-serif}
.hud svg{width:18px;height:18px;fill:var(--route)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--street2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--route)}
.ib{background:none;border:1px solid var(--cb);border-radius:8px;padding:4px 8px;cursor:pointer}
.toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);width:min(92vw,360px);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:#10192b;color:#f4f7fc;border:1px solid #ffc857;box-shadow:0 8px 28px rgba(0,0,0,.35);transform:translate(-50%,-160%);opacity:0;transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .3s;overflow:hidden}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.show::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);animation:sh 1.2s .3s ease-out}
@keyframes sh{to{transform:translateX(100%)}}
.toast svg{width:34px;height:34px;fill:#ffc857;flex:none}
.toast small{display:block;font:700 10px 'Chakra Petch',sans-serif;letter-spacing:.2em;color:#ffc857}
.toast strong{display:block;font:700 17px 'Chakra Petch',sans-serif}.toast span{font-size:13px;color:#b8c5d9}
.pin.on{background:var(--route);color:#111;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.35)}}
.sign{position:relative;z-index:1;display:inline-flex;background:#0b7a4b;color:#fff;border:2px solid #fff;border-radius:6px;padding:3px 9px;font:700 11px 'Chakra Petch',sans-serif;letter-spacing:.08em;margin-bottom:10px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.l .sign{align-self:flex-end}.r .sign{align-self:flex-start}
.card{cursor:zoom-in}
#city{position:absolute;inset:0;pointer-events:none}
.cover::before,.fin::before{content:"";position:absolute;inset:6% 3% 8%;background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--cb);border-radius:24px}
.cover>:not(.pin),.fin>:not(.pin){position:relative;z-index:1}
.lm{display:block;margin:4px auto 0;width:min(270px,74%);background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.lm svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25));transition:transform .3s}
.lm:hover svg,.lm:focus-visible svg{transform:translateY(-4px) scale(1.03)}
.lm small{display:block;margin-top:6px;font:700 10px 'Chakra Petch',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet>div{width:min(100%,520px);background:var(--bg);border:1px solid var(--cb);border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:upx .35s ease-out}
@keyframes upx{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet>div{animation:none}.lm svg{transition:none}}
.bld{position:absolute;transform:translate(-50%,-100%) scaleY(.01);transform-origin:50% 100%;opacity:0;transition:transform 1s cubic-bezier(.2,1.2,.3,1) var(--d,0s),opacity .5s var(--d,0s)}
.bld.up{transform:translate(-50%,-100%);opacity:1}
.bld svg{display:block;overflow:visible}
@media (prefers-reduced-motion:reduce){.bld{transform:translate(-50%,-100%);opacity:1;transition:none}}
.bob{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.cloud{position:fixed;left:0;fill:var(--ink);opacity:.07;animation:dr 70s linear infinite}
.plane{position:fixed;left:0;top:34%;font-size:20px;color:var(--ink);opacity:.25;animation:dr 50s linear infinite 4s}
@keyframes dr{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.compass{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:56px;height:56px;z-index:15}.compass svg{width:100%;height:100%;transform-origin:50% 50%}
.sp{position:fixed;z-index:40;pointer-events:none;width:8px;height:8px;border-radius:2px;animation:bst .9s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.ht{animation:ht 1.6s ease-out forwards;font-size:14px}@keyframes ht{to{transform:translateY(-34px);opacity:0}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.92);display:grid;place-items:center;padding:16px;color:#fff;text-align:center}.lb[hidden]{display:none}.lb img{max-width:100%;max-height:78svh;border-radius:12px}.lb .ib{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;color:#fff;border-color:rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{opacity:1;transform:none;transition:none}.toast{transition:none}.toast.show::after,.pulse,.bob,.cloud,.plane,.ht,.sp,.pin.on{animation:none}}
</style>
