<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0d12;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#edeae2}
.pxf{font-family:'Press Start 2P',monospace}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
#hud>*{pointer-events:auto}
#prog{position:relative;height:26px;background:rgba(8,10,16,.55);border:2px solid rgba(255,255,255,.16);border-radius:14px;backdrop-filter:blur(4px);overflow:visible}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:11px;background:linear-gradient(90deg,#3f8fd6,#7ee08f)}
#progMarks{position:absolute;inset:0}
#progMarks i{position:absolute;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#ffd166;border:2px solid #7a5b12}
#progFlag{position:absolute;top:50%;transform:translate(-50%,-58%);font-size:16px}
#progMe{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px;transition:left .2s linear}
#edl{position:absolute;top:44px;left:12px;background:rgba(8,10,16,.55);border:2px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;font-size:14px;backdrop-filter:blur(4px)}
#edl b{color:#fff}
#hbtns{position:absolute;top:44px;right:12px;display:flex;gap:8px}
.hbtn{border:2px solid rgba(255,255,255,.2);background:rgba(8,10,16,.6);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px)}
.hbtn:active{transform:scale(.94)}
.hidden{display:none!important}
/* ---------- cover ---------- */
#cover{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#2b2358 0%,#7a3f7a 45%,#ff8c5a 78%,#2e1f3d 100%)}
#cover::before{content:"";position:absolute;inset:0;background:
  radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 40% 30%,#fff,transparent),radial-gradient(2px 2px at 85% 35%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 10% 45%,#fff,transparent)}
.cov-card{position:relative;text-align:center;max-width:440px;width:100%;background:rgba(10,12,20,.62);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:34px 26px;backdrop-filter:blur(8px)}
.cov-kicker{font-size:10px;letter-spacing:3px;color:#ffd166;margin-bottom:14px}
.cov-card h1{font-size:21px;line-height:1.7;color:#fff;text-shadow:3px 3px 0 #000;margin-bottom:6px}
.cov-names{font-size:19px;font-weight:700;color:#ffe9b8;margin:12px 0 4px}
.cov-date{font-size:13px;color:#ffd166;margin-bottom:4px}
.cov-mdpl{font-size:11px;color:#9fd8ff;letter-spacing:2px;margin-bottom:14px}
.cov-to{font-size:13px;color:#cfe3ff;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;margin-bottom:18px}
.cov-to:empty{display:none}
#btnStart{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#7ee08f,#3faf5f);color:#08331a;box-shadow:0 4px 0 #256b3a;font-family:inherit}
#btnStart:active{transform:translateY(3px);box-shadow:none}
#btnBiasa2{display:block;width:100%;margin-top:10px;border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:#fff;font-family:inherit}
.cov-hint{margin-top:16px;font-size:11px;color:#9fb3cc;line-height:1.7}
/* ---------- sheet / card ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,12,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .card{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#141824;border:2px solid rgba(255,255,255,.14);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s}
.sheet.open .card{transform:none}
.posbadge{display:inline-block;font-size:10px;letter-spacing:2px;color:#0b0d12;background:#ffd166;border-radius:8px;padding:5px 10px;font-weight:800;margin-bottom:10px}
.card h2{font-size:20px;margin-bottom:2px}
.card .mdpl{font-size:12px;color:#9fd8ff;letter-spacing:1px;margin-bottom:12px}
.card .words{font-size:14.5px;line-height:1.75;color:#d7dee9;margin-bottom:14px}
/* galeri */
.gal{position:relative;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:#0b0d12;margin-bottom:6px}
.gal img#galImg,.gal .gph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;touch-action:pan-y}
.gal .gph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:linear-gradient(160deg,#1d2b4a,#0e1626);color:#8fa8c8;font-size:13px;aspect-ratio:4/3}
.gal .gph span{font-size:34px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.gnav.prev{left:8px}.gnav.next{right:8px}
.gdots{display:flex;gap:6px;justify-content:center;padding:10px 0 2px}
.gdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer}
.gdots i.on{background:#ffd166}
.gthumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 2px}
.gthumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.gthumbs img.on{border-color:#ffd166}
.galempty{border:2px dashed rgba(255,255,255,.18);border-radius:14px;padding:26px;text-align:center;color:#8fa8c8;font-size:13px;margin-bottom:6px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.go{background:linear-gradient(180deg,#7ee08f,#3faf5f);color:#08331a;box-shadow:0 4px 0 #256b3a}
.btn.back{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.2)}
.btn:active{transform:translateY(2px);box-shadow:none}
/* puncak */
.cdown{display:flex;gap:8px;justify-content:center;margin:14px 0}
.cdown div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;min-width:64px;padding:10px 6px;text-align:center}
.cdown b{display:block;font-size:22px;color:#ffd166}
.cdown span{font-size:10px;color:#9fb3cc}
.evcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-bottom:10px}
.evcard h3{font-size:14px;color:#ffd166;margin-bottom:6px}
.evcard p{font-size:13.5px;color:#d7dee9;line-height:1.6}
.evcard .maps{display:inline-block;margin-top:8px;font-size:12.5px;color:#9fd8ff;text-decoration:none;border:1px solid rgba(159,216,255,.4);border-radius:10px;padding:7px 12px}
.rsvp-row{display:flex;gap:10px;margin:10px 0}
.rsvp{flex:1;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.rsvp.yes{background:#25D366;color:#fff}
.rsvp.no{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.2)}
.jml{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;font-size:13px;color:#9fb3cc}
.jml select{background:#0b0d12;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;font-size:14px}
.giftrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;margin-bottom:8px}
.giftrow .t{font-size:13px;line-height:1.6}
.giftrow .t b{color:#ffd166}
.copier{border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.12);color:#ffd166;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0}
/* lightbox */
#lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:94vw;max-height:88vh;border-radius:10px}
#lbX{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
/* lihat biasa */
#biasa{position:fixed;inset:0;z-index:30;background:#0d1017;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#biasa.open{display:block}
.bsec{max-width:560px;margin:0 auto;padding:26px 18px}
.bcard{background:#141824;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;margin-bottom:16px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.bgrid .gph{aspect-ratio:1;border-radius:10px;background:linear-gradient(160deg,#1d2b4a,#0e1626);display:flex;align-items:center;justify-content:center;font-size:26px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:90;background:rgba(10,12,20,.92);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;border-radius:12px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:22px;border-bottom:2px solid rgba(255,255,255,.14)}}

<script>
"use strict";
/* ================= MUSIK: MP3 / YouTube (default MATI) ================= */
var MUSIKURL=DAKI.MUSIK||"";
var musEl=null,ytP=null,ytWant=false,musicOn=false;
function ytId(u){var m=String(u||"").match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);return m?m[1]:null;}
function ytBoot(){
  ytWant=true;
  if(ytP||window._ytB)return;window._ytB=true;
  var d=document.createElement("div");d.id="ytH";
  d.style.cssText="position:fixed;width:4px;height:4px;left:-20px;top:0;opacity:.01;pointer-events:none;z-index:-1;";
  document.body.appendChild(d);
  var t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.appendChild(t);
}
window.onYouTubeIframeAPIReady=function(){
  var id=ytId(MUSIKURL);if(!id||ytP)return;
  ytP=new YT.Player("ytH",{width:4,height:4,videoId:id,
    playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,loop:1,playlist:id},
    events:{onReady:function(){if(ytWant&&musicOn){try{ytP.playVideo();}catch(e){}}},
      onStateChange:function(e){if(e.data===1)ytWant=true;else if(e.data===0&&ytWant&&musicOn){try{ytP.playVideo();}catch(e){}}}}});
};
function musicStart(){
  var id=ytId(MUSIKURL);
  if(id){ytWant=true;if(ytP){try{ytP.playVideo();}catch(e){}}else ytBoot();return;}
  if(MUSIKURL){if(!musEl){musEl=new Audio(MUSIKURL);musEl.loop=true;}musEl.play().catch(function(){});}
}
function musicStop(){
  ytWant=false;
  if(ytP){try{ytP.pauseVideo();}catch(e){}}
  if(musEl)musEl.pause();
}
function toggleMusic(){
  musicOn=!musicOn;
  $("btnMusic").textContent=musicOn?"🔇":"🎵";
  if(musicOn)musicStart();else musicStop();
}
$("btnMusic").addEventListener("click",toggleMusic);
/* sfx mungil */
var _ac=null;
function blip(f){try{
  _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==="suspended")_ac.resume();
  var o=_ac.createOscillator(),g=_ac.createGain();
  o.type="sine";o.frequency.value=f||880;
  g.gain.setValueAtTime(0.0001,_ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.08,_ac.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,_ac.currentTime+0.18);
  o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+0.2);
}catch(e){}}
</script>

<script>
"use strict";
/* ================= WORLD & GAME ================= */
var cv=$("game"),ctx=cv.getContext("2d");
var view={w:0,h:0,dpr:1};
function resize(){
  view.dpr=Math.min(2,window.devicePixelRatio||1);
  view.w=window.innerWidth;view.h=window.innerHeight;
  cv.width=view.w*view.dpr;cv.height=view.h*view.dpr;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
}
window.addEventListener("resize",resize);resize();

var WORLD_W=5200,GRAV=1650,JUMPV=-640;
/* profil gunung: tanjakan curam zigzag + pos di tanah datar */
var ELEV=[[0,0],[120,0],[950,640],[1150,640],[2000,1290],[2200,1290],[3050,1940],[3250,1940],[4100,2590],[4300,2590],[4950,3050],[5200,3050]];
var ELEV_MAX=3050;
function elev(x){
  x=clamp(x,0,WORLD_W);
  for(var i=0;i<ELEV.length-1;i++){
    var a=ELEV[i],b=ELEV[i+1];
    if(x>=a[0]&&x<=b[0]){
      var t=(x-a[0])/((b[0]-a[0])||1);
      t=t*t*(3-2*t);
      return a[1]+(b[1]-a[1])*t;
    }
  }
  return ELEV_MAX;
}
function slopeAt(x){return (elev(x+14)-elev(x-14))/28;}
function groundY(x){return view.h*0.62-(elev(x)-S.camY);}
var POST_F=[1000/WORLD_W,2000/WORLD_W,3000/WORLD_W,4000/WORLD_W],PEAK_F=0.96;
var posts=[],obstacles=[],edels=[],pines=[],FAR=[],NEAR=[];
(function genWorld(){
  var rnd=mulberry(7);
  POST_F.forEach(function(f,i){posts.push({x:f*WORLD_W,i:i});});
  for(var i=0;i<14;i++){
    var x=300+i*350+rnd()*120;
    if(x>WORLD_W*0.93)continue;
    var nearPost=POST_F.some(function(f){return Math.abs(x-f*WORLD_W)<230;});
    if(nearPost)continue;
    obstacles.push({x:x,type:i%2?"root":"rock"});
  }
  for(var j=0;j<12;j++){
    var ex=450+j*390+rnd()*150;
    if(ex>WORLD_W*0.94)continue;
    edels.push({x:ex,taken:false,bob:rnd()*6.28});
  }
  for(var k=0;k<40;k++)pines.push({x:k*150+rnd()*90,s:0.8+rnd()*0.7});
  for(var m=0;m<30;m++)FAR.push({x:m*260,h:120+rnd()*160});
  for(var n=0;n<36;n++)NEAR.push({x:n*220,h:80+rnd()*110});
})();
var PEAK_X=PEAK_F*WORLD_W;

var S={mode:"cover",x:60,y:0,vy:0,grounded:true,ft:0,camY:0,slope:0,visited:[false,false,false,false],
  edel:0,done:false,paused:false,stun:0,camX:0};
var P=[]; // particles
function spawnP(x,y,n,colors,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,v=(spd||120)*(0.4+Math.random()*0.8);
    P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.9+Math.random()*0.5,t:0,
      c:colors[i%colors.length],s:2+Math.random()*3});
  }
}
/* langit fajar -> siang -> senja */
var SKY=[
  {p:0,top:"#7fb2e8",mid:"#bcd9f7",bot:"#ffe8c4"},
  {p:0.5,top:"#3f8fd6",mid:"#8fd0ff",bot:"#eaf7ff"},
  {p:1,top:"#2b1a4e",mid:"#b4506e",bot:"#ffb36b"}
];
function skyCol(p,key){
  var a=SKY[0],b=SKY[1];
  if(p>0.5){a=SKY[1];b=SKY[2];p=(p-0.5)*2;}else{p=p*2;}
  var pa=hex2rgb(a[key]),pb=hex2rgb(b[key]);
  return "rgb("+Math.round(lerp(pa[0],pb[0],p))+","+Math.round(lerp(pa[1],pb[1],p))+","+Math.round(lerp(pa[2],pb[2],p))+")";
}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function jump(){
  if(S.mode!=="game"||S.paused||S.done)return;
  if(S.grounded){S.vy=JUMPV;S.grounded=false;blip(520);}
}
cv.addEventListener("pointerdown",function(e){jump();});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}
});

function update(dt){
  if(S.mode!=="game"||S.paused)return;
  if(S.stun>0)S.stun-=dt;
  var sl=slopeAt(S.x);S.slope=sl;
  var spd=clamp(150-sl*70,95,155);
  if(!S.done&&S.stun<=0)S.x+=spd*dt;
  S.ft+=dt;
  // fisika
  var g=groundY(S.x);
  S.vy+=GRAV*dt;S.y+=S.vy*dt;S.grounded=false;
  if(S.y>=g){S.y=g;S.vy=0;S.grounded=true;}
  // rintangan
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    if(Math.abs(o.x-S.x)>70)continue;
    var gy=groundY(o.x);
    var ow=o.type==="rock"?36:36,oh=o.type==="rock"?21:15;
    var oTop=gy-oh;
    if(S.x+16>o.x-ow/2&&S.x-16<o.x+ow/2&&S.y>oTop&&S.y-56<gy){
      if(S.y-oTop<16&&S.vy>=0){S.y=oTop;S.vy=0;S.grounded=true;}
      else if(S.stun<=0){
        S.x=Math.max(60,S.x-90);S.stun=0.7;
        spawnP(S.x,S.y-20,8,["#cbb","#9a9a9a"],140);
        blip(180);toast("Aduh, kesandung! Ayo lanjut 🧗");
      }
    }
  }
  // edelweis
  for(var j=0;j<edels.length;j++){
    var e=edels[j];
    if(e.taken||Math.abs(e.x-S.x)>90)continue;
    var ey=groundY(e.x)-34+Math.sin(S.ft*3+e.bob)*5;
    if(Math.abs(e.x-S.x)<30&&Math.abs(ey-(S.y-30))<46){
      e.taken=true;S.edel++;
      $("edlN").textContent=S.edel;
      spawnP(e.x,ey,10,["#ffffff","#ffd94d","#fff"],160);
      blip(880+Math.random()*240);
      if(S.edel===edels.length)toast("❀ Semua edelweis terkumpul! Luar biasa!");
    }
  }
  // pos
  for(var k=0;k<posts.length;k++){
    if(!S.visited[k]&&S.x>=posts[k].x-24){
      S.visited[k]=true;S.paused=true;openPost(k);break;
    }
  }
  // puncak
  if(!S.done&&S.x>=PEAK_X){
    S.done=true;S.paused=true;
    spawnP(PEAK_X,groundY(PEAK_X)-120,90,["#ffd166","#ff6b6b","#7ee08f","#9fd8ff","#fff"],260);
    blip(1040);setTimeout(function(){blip(1310);},160);
    openPeak();
  }
  // kamera
  var target=clamp(S.x-view.w*0.38,0,WORLD_W-view.w*0.85);
  S.camX+=(target-S.camX)*Math.min(1,dt*5);
  var targetY=elev(S.x);
  S.camY+=(targetY-S.camY)*Math.min(1,dt*3.2);
  // HUD
  var pr=clamp(S.x/WORLD_W,0,1);
  $("progFill").style.width=(pr*100)+"%";
  $("progMe").style.left=(pr*100)+"%";
  $("edlMdpl").textContent=Math.round(elev(S.x)/ELEV_MAX*3200).toLocaleString("id-ID")+" mdpl";
  // partikel
  for(var n=P.length-1;n>=0;n--){
    var pt=P[n];pt.t+=dt;
    if(pt.t>pt.life){P.splice(n,1);continue;}
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=300*dt;
  }
}

function ridge(arr,par,baseY,color,snow){
  ctx.fillStyle=color;
  arr.forEach(function(m){
    var sx=m.x-par*S.camX;
    if(sx<-300||sx>view.w+300)return;
    var by=baseY;
    ctx.beginPath();
    ctx.moveTo(sx-260,by);ctx.lineTo(sx,by-m.h);ctx.lineTo(sx+260,by);ctx.closePath();ctx.fill();
    if(snow){
      ctx.fillStyle="rgba(255,255,255,.85)";
      ctx.beginPath();
      ctx.moveTo(sx-52,by-m.h+104);ctx.lineTo(sx,by-m.h);ctx.lineTo(sx+52,by-m.h+104);
      ctx.lineTo(sx+30,by-m.h+104);ctx.lineTo(sx,by-m.h+34);ctx.lineTo(sx-30,by-m.h+104);
      ctx.closePath();ctx.fill();
      ctx.fillStyle=color;
    }
  });
}

var clouds=[];
(function(){var r=mulberry(21);for(var i=0;i<10;i++)clouds.push({x:i*700+r()*300,y:40+r()*140,s:0.7+r()*0.8,v:6+r()*10});})();

function render(){
  var W=view.w,H=view.h,cam=S.camX;
  var pr=clamp(elev(S.x)/ELEV_MAX,0,1);
  // langit
  var gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,skyCol(pr,"top"));gr.addColorStop(0.55,skyCol(pr,"mid"));gr.addColorStop(1,skyCol(pr,"bot"));
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  // matahari
  var sunx=W*(0.12+0.76*pr),suny=H*(0.62-0.42*Math.sin(pr*Math.PI));
  ctx.fillStyle=pr>0.85?"#ffdf9e":"#fff3c4";
  ctx.beginPath();ctx.arc(sunx,suny,26,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,243,196,.35)";
  ctx.beginPath();ctx.arc(sunx,suny,40,0,7);ctx.fill();
  // awan
  ctx.fillStyle="rgba(255,255,255,.75)";
  clouds.forEach(function(c){
    var cx=((c.x-cam*0.3+S.ft*c.v)%(W+400))-200;
    var cy=c.y-S.camY*0.08;
    ctx.fillRect(cx,cy,70*c.s,18*c.s);
    ctx.fillRect(cx+14*c.s,cy-10*c.s,44*c.s,16*c.s);
    ctx.fillRect(cx+60*c.s,cy+4*c.s,40*c.s,14*c.s);
  });
  // gunung jauh & dekat
  ridge(FAR,0.22,H*0.72,pr>0.7?"#3a2a5e":"#6a7fa8",true);
  ridge(NEAR,0.45,H*0.80,pr>0.7?"#2c2148":"#4a5f88",true);
  // pinus
  pines.forEach(function(p){
    var sx=p.x-cam*0.72;
    if(sx<-40||sx>W+40)return;
    var gy2=groundY(sx+cam);
    var s=p.s*(0.9+pr*0.2);
    ctx.drawImage(PINE,sx-18*s,gy2-42*s,36*s,42*s);
  });
  // tanah
  ctx.beginPath();ctx.moveTo(0,H);
  for(var sx=0;sx<=W;sx+=14)ctx.lineTo(sx,groundY(sx+cam));
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle=pr>0.7?"#232038":"#3d5a3a";ctx.fill();
  ctx.strokeStyle=pr>0.7?"#4a4468":"#6a9a5a";ctx.lineWidth=5;ctx.beginPath();
  for(var sx2=0;sx2<=W;sx2+=14){var gy3=groundY(sx2+cam);sx2===0?ctx.moveTo(sx2,gy3):ctx.lineTo(sx2,gy3);}
  ctx.stroke();
  // edelweis
  edels.forEach(function(e){
    if(e.taken)return;
    var sx=e.x-cam;if(sx<-40||sx>W+40)return;
    var ey=groundY(e.x)-34+Math.sin(S.ft*3+e.bob)*5;
    ctx.drawImage(EDELWEIS,sx-13,ey-13,27,27);
  });
  // rintangan
  obstacles.forEach(function(o){
    var sx=o.x-cam;if(sx<-60||sx>W+60)return;
    var gy=groundY(o.x);
    if(o.type==="rock")ctx.drawImage(ROCK,sx-18,gy-21,36,21);
    else ctx.drawImage(ROOT,sx-18,gy-15,36,15);
  });
  // pos beneran: papan nama + bunga + shelter
  posts.forEach(function(p,i){drawPost(p,i,W);});
  drawPeak(W);
  // karakter
  (function(){
    var sx=S.x-cam,sy=S.y;
    var fr=S.grounded?(Math.floor(S.ft*7)%2?HERO_A:HERO_B):HERO_A;
    var tilt=S.grounded?Math.atan(S.slope||0)*0.85:-0.08;
    ctx.save();ctx.translate(sx,sy);
    if(S.stun>0)ctx.translate(Math.sin(S.ft*40)*4,0);
    ctx.rotate(tilt);
    ctx.drawImage(fr,-28,-60,56,60);
    ctx.restore();
  })();
  // partikel
  P.forEach(function(pt){
    ctx.globalAlpha=1-pt.t/pt.life;
    ctx.fillStyle=pt.c;
    ctx.fillRect(pt.x-cam,pt.y,pt.s,pt.s);
  });
  ctx.globalAlpha=1;
}

function flowerCluster(x,gy,n){
  n=n||4;
  for(var k=0;k<n;k++){
    var fx=x+(k-(n-1)/2)*24;
    var fy=gy-6-((k*37)%3)*5;
    ctx.drawImage(EDELWEIS,fx-12,fy-24,24,24);
  }
  ctx.fillStyle="#3faf5f";
  for(var g2=0;g2<6;g2++){
    var gx=x-36+g2*15;
    ctx.fillRect(gx,gy-12-((g2*29)%3)*4,5,12);
  }
}
function drawPost(p,i,W){
  var sx=p.x-S.camX;if(sx<-150||sx>W+150)return;
  var gy=groundY(p.x);
  var d=DAKI.POS[i];
  flowerCluster(sx-95,gy,4);
  flowerCluster(sx+95,gy,4);
  ctx.drawImage(TENT,sx+58,gy-30,57,30);
  ctx.fillStyle="#4a2f1a";
  ctx.fillRect(sx-9,gy-66,11,66);
  ctx.fillRect(sx+32,gy-66,11,66);
  ctx.fillStyle="#8a5a2e";
  ctx.fillRect(sx-48,gy-108,118,46);
  ctx.strokeStyle="#2e1c0c";ctx.lineWidth=3;
  ctx.strokeRect(sx-48,gy-108,118,46);
  ctx.fillStyle="#6e4526";
  ctx.beginPath();
  ctx.moveTo(sx-58,gy-108);ctx.lineTo(sx+11,gy-128);ctx.lineTo(sx+80,gy-108);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#ffe9b8";ctx.textAlign="center";
  ctx.font="11px 'Press Start 2P', monospace";
  ctx.fillText("POS "+(i+1),sx+11,gy-88);
  ctx.font="8px 'Press Start 2P', monospace";
  ctx.fillStyle="#ffd166";
  ctx.fillText(d.mdpl+" MDPL",sx+11,gy-72);
}
function drawPeak(W){
  var sx=PEAK_X-S.camX;if(sx<-150||sx>W+150)return;
  var gy=groundY(PEAK_X);
  flowerCluster(sx-85,gy,5);
  flowerCluster(sx+85,gy,5);
  ctx.fillStyle="#6a6a72";
  ctx.fillRect(sx-26,gy-34,52,34);
  ctx.fillStyle="#7d7d88";
  ctx.fillRect(sx-20,gy-52,40,20);
  ctx.fillStyle="#8f8f9a";
  ctx.fillRect(sx-14,gy-66,28,16);
  ctx.strokeStyle="#3c3c44";ctx.lineWidth=2;
  ctx.strokeRect(sx-26,gy-34,52,34);
  ctx.fillStyle="#4a2f1a";ctx.fillRect(sx+34,gy-120,8,120);
  ctx.fillStyle="#d94f3d";
  var wv=Math.sin(S.ft*6)*4;
  ctx.beginPath();
  ctx.moveTo(sx+42,gy-120);ctx.lineTo(sx+104+wv,gy-108);ctx.lineTo(sx+42,gy-94);
  ctx.closePath();ctx.fill();
}
var lastT=0;
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000||0.016);lastT=t;
  if(S.mode==="game")update(dt);
  if(S.mode!=="biasa")render();
  requestAnimationFrame(loop);
}
</script>
<script>
"use strict";
/* ================= GALERI ================= */
var GAL={};
function initGallery(gid,fotos){
  GAL[gid]={f:fotos,i:0};
  var gal=$("gal-"+gid);
  gal.innerHTML='<img id="galImg-'+gid+'" alt="">'+
    (fotos.length>1?'<button class="gnav prev" data-g="'+gid+'">‹</button><button class="gnav next" data-g="'+gid+'">›</button>':"");
  var dots=$("gdots-"+gid),th=$("gth-"+gid);
  dots.innerHTML=fotos.map(function(_,k){return '<i data-k="'+k+'"></i>';}).join("");
  th.innerHTML=fotos.map(function(f,k){return '<img data-k="'+k+'" src="'+esc(f)+'" loading="lazy" alt="">';}).join("");
  function show(k){
    var G=GAL[gid];G.i=(k+G.f.length)%G.f.length;
    var im=$("galImg-"+gid);im.src=G.f[G.i];
    im.onclick=function(){$("lbImg").src=G.f[G.i];$("lb").classList.add("open");};
    dots.querySelectorAll("i").forEach(function(d,j){d.classList.toggle("on",j===G.i);});
    th.querySelectorAll("img").forEach(function(t,j){t.classList.toggle("on",j===G.i);});
  }
  gal.querySelectorAll(".gnav").forEach(function(b){
    b.onclick=function(e){e.stopPropagation();show(GAL[gid].i+(b.classList.contains("next")?1:-1));};
  });
  dots.querySelectorAll("i").forEach(function(d){d.onclick=function(){show(+d.getAttribute("data-k"));};});
  th.querySelectorAll("img").forEach(function(t){t.onclick=function(){show(+t.getAttribute("data-k"));};});
  var sx0=0;
  gal.addEventListener("pointerdown",function(e){sx0=e.clientX;});
  gal.addEventListener("pointerup",function(e){
    var dx=e.clientX-sx0;
    if(Math.abs(dx)>40)show(GAL[gid].i+(dx<0?1:-1));
  });
  GAL[gid].show=show;show(0);
}
$("lbX").onclick=function(){$("lb").classList.remove("open");};
$("lb").addEventListener("click",function(e){if(e.target.id==="lb")$("lb").classList.remove("open");});

/* ================= KARTU POS ================= */
function openPost(i){
  var d=DAKI.POS[i];
  var fotos=(d.img||[]).filter(Boolean);
  var h='<span class="posbadge pxf">POS '+(i+1)+' · '+esc(d.mdpl)+' MDPL</span>';
  h+='<h2>'+esc(d.t)+'</h2>';
  h+='<p class="words">'+esc(d.x)+'</p>';
  if(fotos.length){
    h+='<div class="gal" id="gal-pos'+i+'"></div><div class="gdots" id="gdots-pos'+i+'"></div><div class="gthumbs" id="gth-pos'+i+'"></div>';
  }else{
    h+='<div class="galempty">📷<br>Foto momen di '+esc(d.t)+' akan tampil di sini</div>';
  }
  h+='<div class="btnrow"><button class="btn go" id="postGo">LANJUT MENDAKI ▶</button></div>';
  $("postCard").innerHTML=h;
  $("postSheet").classList.add("open");
  if(fotos.length)initGallery("pos"+i,fotos);
  blip(660);
  $("postGo").onclick=function(){
    $("postSheet").classList.remove("open");
    S.paused=false;
    toast("Pos "+(i+1)+" selesai! ❀ "+S.edel+"/"+edels.length);
  };
}

/* ================= KARTU PUNCAK ================= */
var cdTimer=null;
function cdParts(){
  var t=new Date(DAKI.TGL_ISO).getTime()-Date.now();
  if(t<0)t=0;
  return {d:Math.floor(t/864e5),h:Math.floor(t/36e5)%24,m:Math.floor(t/6e4)%60,s:Math.floor(t/1e3)%60};
}
function updateCd(){
  var p=cdParts();
  if($("cdD")){$("cdD").textContent=p.d;$("cdH").textContent=p.h;$("cdM").textContent=p.m;$("cdS").textContent=p.s;}
}
function rsvp(ok){
  var g=TO||"Tamu Undangan";
  var n=($("jmlN")&&$("jmlN").value)||"1";
  var txt="Halo "+DAKI.PRIA+" & "+DAKI.WANITA+"! Saya "+g+" — konfirmasi kehadiran: "+(ok?"HADIR":"BERHALANGAN")+(ok?", jumlah "+n+" orang":"")+". Terima kasih! 🙏";
  window.open("https://wa.me/"+DAKI.WA+"?text="+encodeURIComponent(txt),"_blank");
}
function wish(){
  var g=TO?("Saya "+TO+", "):"";
  var txt="Halo "+DAKI.PRIA+" & "+DAKI.WANITA+"! "+g+"selamat menempuh hidup baru! Semoga menjadi keluarga yang sakinah, mawaddah, warahmah. ❤️🤲";
  window.open("https://wa.me/"+DAKI.WA+"?text="+encodeURIComponent(txt),"_blank");
}
function copyTxt(t,btn){
  function done(){var o=btn.textContent;btn.textContent="✓ Tersalin!";setTimeout(function(){btn.textContent=o;},1500);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(function(){fallback();});
  }else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}
}
function peakHTML(){
  var h='<span class="posbadge pxf">🏔️ PUNCAK · 3.200 MDPL</span>';
  h+='<h2>Sampai di Puncak!</h2>';
  h+='<p class="words">'+esc(DAKI.NAMA_PRIA)+' & '+esc(DAKI.NAMA_WANITA)+'<br><span style="font-size:13px;color:#9fb3cc">'+esc(DAKI.TGL_TAMPIL)+'</span></p>';
  h+='<div class="cdown"><div><b id="cdD">0</b><span>HARI</span></div><div><b id="cdH">0</b><span>JAM</span></div><div><b id="cdM">0</b><span>MENIT</span></div><div><b id="cdS">0</b><span>DETIK</span></div></div>';
  h+='<div class="evcard"><h3>💒 Akad Nikah</h3><p>'+esc(DAKI.AKAD_WAKTU)+'<br>'+esc(DAKI.AKAD_TEMPAT)+'</p>'+(DAKI.AKAD_MAPS?'<a class="maps" target="_blank" rel="noopener" href="'+esc(DAKI.AKAD_MAPS)+'">📍 Buka Maps</a>':"")+'</div>';
  h+='<div class="evcard"><h3>🎉 Resepsi</h3><p>'+esc(DAKI.RESEPSI_WAKTU)+'<br>'+esc(DAKI.RESEPSI_TEMPAT)+'</p>'+(DAKI.RESEPSI_MAPS?'<a class="maps" target="_blank" rel="noopener" href="'+esc(DAKI.RESEPSI_MAPS)+'">📍 Buka Maps</a>':"")+'</div>';
  h+='<h3 style="font-size:14px;margin:14px 0 4px">📩 Konfirmasi Kehadiran</h3>';
  h+='<div class="jml">Jumlah tamu: <select id="jmlN"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>';
  h+='<div class="rsvp-row"><button class="rsvp yes" id="rsvpY">✅ Saya Hadir</button><button class="rsvp no" id="rsvpN">❌ Berhalangan</button></div>';
  h+='<button class="btn back" id="wishB" style="width:100%">💌 Kirim Ucapan</button>';
  if(DAKI.REK&&DAKI.REK.length){
    h+='<h3 style="font-size:14px;margin:16px 0 8px">🎁 Tanda Kasih</h3>';
    DAKI.REK.forEach(function(r){
      h+='<div class="giftrow"><div class="t"><b>'+esc(r.b)+'</b><br>'+esc(r.n)+'<br><span style="color:#9fb3cc">a.n. '+esc(r.a)+'</span></div><button class="copier" data-n="'+esc(r.n)+'">Salin</button></div>';
    });
  }
  h+='<p style="margin-top:12px;font-size:12.5px;color:#9fb3cc;text-align:center">❀ Edelweis terkumpul: <b style="color:#ffd166">'+S.edel+'/'+edels.length+'</b></p>';
  return h;
}
function wirePeak(){
  updateCd();
  if(cdTimer)clearInterval(cdTimer);
  cdTimer=setInterval(updateCd,1000);
  $("rsvpY").onclick=function(){rsvp(true);};
  $("rsvpN").onclick=function(){rsvp(false);};
  $("wishB").onclick=wish;
  document.querySelectorAll("#peakCard .copier").forEach(function(b){
    b.onclick=function(){copyTxt(b.getAttribute("data-n"),b);};
  });
}
function openPeak(){
  $("peakCard").innerHTML=peakHTML()+'<div class="btnrow"><button class="btn back" id="peakClose">Tutup</button></div>';
  $("peakSheet").classList.add("open");
  wirePeak();
  $("peakClose").onclick=function(){
    $("peakSheet").classList.remove("open");
    if(cdTimer)clearInterval(cdTimer);
    S.paused=false;
  };
}

/* ================= LIHAT BIASA ================= */
function phBox(i){return '<div class="gph">🏔️</div>';}
function openBiasa(){
  S._prev=S.mode;S.mode="biasa";
  var h='<div class="bsec">';
  h+='<div class="bcard" style="text-align:center;background:linear-gradient(160deg,#1b2140,#0d1017)">';
  h+='<p class="pxf" style="font-size:9px;letter-spacing:3px;color:#ffd166;margin-bottom:10px">UNDANGAN PERNIKAHAN</p>';
  h+='<h1 class="pxf" style="font-size:17px;line-height:1.8">🏔️<br>PENDAKIAN CINTA</h1>';
  h+='<p style="margin:12px 0 4px;font-size:18px;font-weight:700">'+esc(DAKI.NAMA_PRIA)+' & '+esc(DAKI.NAMA_WANITA)+'</p>';
  h+='<p style="font-size:13px;color:#ffd166">'+esc(DAKI.TGL_TAMPIL)+'</p>';
  if(TO)h+='<p style="margin-top:10px;font-size:13px;color:#cfe3ff">Halo, <b>'+esc(TO)+'</b>! 👋</p>';
  h+='<button class="btn go" id="bGame" style="margin-top:16px">🧗 MODE GAME</button></div>';
  DAKI.POS.forEach(function(d,i){
    var fotos=(d.img||[]).filter(Boolean);
    h+='<div class="bcard"><span class="posbadge pxf">POS '+(i+1)+' · '+esc(d.mdpl)+' MDPL</span>';
    h+='<h2 style="font-size:18px;margin-bottom:10px">'+esc(d.t)+'</h2>';
    h+='<p class="words">'+esc(d.x)+'</p>';
    if(fotos.length){
      h+='<div class="bgrid">'+fotos.map(function(f){return '<img src="'+esc(f)+'" loading="lazy" alt="">';}).join("")+'</div>';
    }
    h+='</div>';
  });
  var p=cdParts();
  h+='<div class="bcard" style="text-align:center"><span class="posbadge pxf">🏔️ PUNCAK · 3.200 MDPL</span>';
  h+='<h2 style="font-size:18px;margin:8px 0">Hari Bahagia</h2>';
  h+='<p style="font-size:26px;font-weight:800;color:#ffd166">'+p.d+' <span style="font-size:13px;color:#9fb3cc">hari lagi</span></p>';
  h+='<div class="evcard" style="text-align:left;margin-top:12px"><h3>💒 Akad Nikah</h3><p>'+esc(DAKI.AKAD_WAKTU)+'<br>'+esc(DAKI.AKAD_TEMPAT)+'</p></div>';
  h+='<div class="evcard" style="text-align:left"><h3>🎉 Resepsi</h3><p>'+esc(DAKI.RESEPSI_WAKTU)+'<br>'+esc(DAKI.RESEPSI_TEMPAT)+'</p></div>';
  h+='<div class="rsvp-row"><button class="rsvp yes" id="bRsvpY">✅ Saya Hadir</button><button class="rsvp no" id="bRsvpN">❌ Berhalangan</button></div>';
  h+='<button class="btn back" id="bWish" style="width:100%">💌 Kirim Ucapan via WA</button>';
  if(DAKI.REK&&DAKI.REK.length){
    h+='<h3 style="font-size:14px;margin:14px 0 8px;text-align:left">🎁 Tanda Kasih</h3>';
    DAKI.REK.forEach(function(r){
      h+='<div class="giftrow"><div class="t" style="text-align:left"><b>'+esc(r.b)+'</b><br>'+esc(r.n)+'<br><span style="color:#9fb3cc">a.n. '+esc(r.a)+'</span></div><button class="copier" data-n="'+esc(r.n)+'">Salin</button></div>';
    });
  }
  h+='</div>';
  h+='<p style="text-align:center;font-size:11px;color:#5a6a85;padding:10px">Pendakian Cinta · undangen.my.id</p>';
  h+='</div>';
  var b=$("biasa");b.innerHTML=h;b.classList.add("open");b.scrollTop=0;
  $("bGame").onclick=function(){
    b.classList.remove("open");
    if(!S.started)startGame();else{S.mode="game";}
  };
  $("bRsvpY").onclick=function(){rsvp(true);};
  $("bRsvpN").onclick=function(){rsvp(false);};
  $("bWish").onclick=wish;
  b.querySelectorAll(".bgrid img").forEach(function(im){
    im.onclick=function(){$("lbImg").src=im.src;$("lb").classList.add("open");};
  });
  b.querySelectorAll(".copier").forEach(function(btn){
    btn.onclick=function(){copyTxt(btn.getAttribute("data-n"),btn);};
  });
}

/* ================= INIT ================= */
function startGame(){
  $("cover").style.display="none";
  $("hud").classList.remove("hidden");
  S.mode="game";S.started=true;
  S.y=groundY(S.x);
  toast("🧗 Selamat mendaki! Ketuk untuk melompat.");
}
(function init(){
  S.y=groundY(S.x);
  $("covNames").textContent=DAKI.NAMA_PRIA+" & "+DAKI.NAMA_WANITA;
  $("covDate").textContent=DAKI.TGL_TAMPIL;
  if(TO)$("covTo").innerHTML="Halo, <b>"+esc(TO)+"</b>! 👋<br>Undangan spesial untukmu";
  $("edlT").textContent=edels.length;
  var mk=$("progMarks");
  POST_F.forEach(function(f){var i=document.createElement("i");i.style.left=(f*100)+"%";mk.appendChild(i);});
  $("progFlag").style.left=(PEAK_F*100)+"%";
  $("btnStart").onclick=startGame;
  $("btnBiasa").onclick=openBiasa;
  $("btnBiasa2").onclick=openBiasa;
  $("btnSkip").onclick=function(){
    if(S.mode!=="game")return;
    if(S.done){openPeak();return;}
    S.x=PEAK_X-40;
    toast("⏭ Melompat ke puncak…");
  };
  if(MUSIKURL)$("btnMusic").classList.remove("hidden");
  requestAnimationFrame(loop);
})();
</script>
